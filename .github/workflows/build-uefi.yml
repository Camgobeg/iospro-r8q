name: Build SM8250 UEFI Firmware (EDK2)

on:
  push:
    paths:
      - 'boot/uefi/**'
      - '.github/workflows/build-uefi.yml'
  workflow_dispatch:

jobs:
  build-uefi:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install EDK2 Build Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential uuid-dev iasl git gcc-aarch64-linux-gnu \
            python3 python3-pip python-is-python3 device-tree-compiler

      - name: Build XNULoader Binary
        run: |
          cd boot/xnuloader
          make CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p ../../out
          cp xnuloader.bin ../../out/xnuloader.bin

      - name: Upload Loader Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xnuloader-sm8250-r8q
          path: out/xnuloader.bin
