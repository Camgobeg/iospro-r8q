name: Build Darwin RootFS & Ramdisk

on:
  push:
    paths:
      - 'rootfs/**'
      - '.github/workflows/build-rootfs.yml'
  workflow_dispatch:

jobs:
  build-rootfs:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio gzip python3

      - name: Build Ramdisk (initrd)
        run: |
          chmod +x rootfs/scripts/make-ramdisk.sh
          ./rootfs/scripts/make-ramdisk.sh

      - name: Upload RootFS Ramdisk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ramdisk-sm8250-r8q
          path: out/ramdisk.cpio.gz
