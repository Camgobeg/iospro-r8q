name: Assemble Android boot.img

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  assemble-bootimg:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu clang lld cpio

      - name: Build XNULoader
        run: |
          cd boot/xnuloader
          make CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p ../../out
          cp xnuloader.bin ../../out/xnuloader.bin
          cd ../..

      - name: Build XNU Kernel
        run: |
          chmod +x kernel/scripts/build-kernel.sh
          ./kernel/scripts/build-kernel.sh

      - name: Build Ramdisk
        run: |
          chmod +x rootfs/scripts/make-ramdisk.sh
          ./rootfs/scripts/make-ramdisk.sh

      - name: Generate Android boot.img
        run: |
          python3 boot/android/mkbootimg.py \
            --kernel out/xnuloader.bin \
            --ramdisk out/ramdisk.cpio.gz \
            --pagesize 4096 \
            --header_version 2 \
            --cmdline "console=simplefb -v debug=0x14e cs_enforcement=0" \
            -o out/boot.img

          sha256sum out/boot.img > out/boot.img.sha256
          echo "Generated boot.img size: $(stat -c%s out/boot.img) bytes"
          cat out/boot.img.sha256

      - name: Upload boot.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-img-sm8250-r8q
          path: |
            out/boot.img
            out/boot.img.sha256
            out/xnuloader.bin
            out/ramdisk.cpio.gz
            out/mach_kernel.arm64
